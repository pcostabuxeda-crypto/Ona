# `tauri ios init` només funciona en macOS: aquest workflow genera src-tauri/gen/apple
# en un runner macOS i el desa amb un commit a la mateixa branca (una sola vegada).
name: iOS init
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/ios-init.yml, src-tauri/tauri.conf.json]
permissions:
  contents: write
jobs:
  init:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ja inicialitzat?
        id: check
        run: test -d src-tauri/gen/apple && echo "done=1" >> "$GITHUB_OUTPUT" || true
      - uses: actions/setup-node@v4
        if: steps.check.outputs.done != '1'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.done != '1'
        run: |
          npm ci
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          npx tauri ios init --ci
          # Sense pods: el target ona_macOS del Podfile de Tauri fa fallar `pod install` a Builder.
          rm src-tauri/gen/apple/Podfile
          # Música amb la pantalla bloquejada, i la tornada de l'OAuth a 127.0.0.1 dins la vista.
          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes array" -c "Add :UIBackgroundModes:0 string audio" \
            -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" \
            src-tauri/gen/apple/ona_iOS/Info.plist
      - name: Commit de gen/apple
        if: steps.check.outputs.done != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/gen/apple
          git commit -m "Genera el projecte d'Xcode de Tauri (tauri ios init)"
          git push
